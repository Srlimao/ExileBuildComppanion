name: Release Desktop (Windows)

on:
  push:
    branches: [main]
    paths:
      - "apps/desktop/**"
      - "packages/core/**"
      - "packages/game-data/**"
      - "packages/hud-ui/**"
      - "apps/pwa/public/**"
      - "scripts/generate_tauri_icons.mjs"
      - "scripts/stamp_desktop_release_version.mjs"
      - ".github/workflows/release-desktop.yml"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Optional release tag (defaults to v0.1.<run_number>)"
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-desktop
  cancel-in-progress: false

jobs:
  build-windows-release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: "apps/desktop/src-tauri -> target"
      - run: pnpm install --frozen-lockfile
      - name: Compute & Stamp Release Version
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          $inputTag = "${{ inputs.tag_name }}".Trim()
          if ($inputTag) {
            $tag = $inputTag
          } elseif ($env:GITHUB_REF_TYPE -eq "tag") {
            $tag = $env:GITHUB_REF_NAME
          } else {
            $tag = "v0.1.$($env:GITHUB_RUN_NUMBER)"
          }

          $semver = $tag -replace '^[vV]', ''
          if ($semver -notmatch '^\d+\.\d+\.\d+(-[0-9A-Za-z.-]+)?$') {
            $semver = "0.1.$($env:GITHUB_RUN_NUMBER)"
          }

          "RELEASE_TAG=$tag" | Out-File -FilePath $env:GITHUB_ENV -Encoding UTF8 -Append
          "RELEASE_SEMVER=$semver" | Out-File -FilePath $env:GITHUB_ENV -Encoding UTF8 -Append
          node scripts/stamp_desktop_release_version.mjs $semver
      - run: node scripts/generate_tauri_icons.mjs
      - run: cargo test --manifest-path apps/desktop/src-tauri/Cargo.toml
      - name: Build Tauri Portable Exe & NSIS Installer
        run: pnpm --filter @exile-hud/desktop tauri build --bundles nsis --no-binary-patching --ci
      - name: Stage Stable Assets & Publish Latest GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $ErrorActionPreference = "Stop"
          $tag = $env:RELEASE_TAG

          New-Item -ItemType Directory -Force -Path release-assets | Out-Null

          $portableSrc = "apps/desktop/src-tauri/target/release/exile_companion_host.exe"
          if (-not (Test-Path $portableSrc)) {
            throw "Missing portable executable at $portableSrc"
          }
          Copy-Item $portableSrc "release-assets/ExileRelay.exe" -Force
          Copy-Item $portableSrc "release-assets/ExileCompanionHUD.exe" -Force

          $nsisInstaller = Get-ChildItem "apps/desktop/src-tauri/target/release/bundle/nsis/*-setup.exe" | Select-Object -First 1
          if (-not $nsisInstaller) {
            throw "Missing NSIS setup installer in apps/desktop/src-tauri/target/release/bundle/nsis/"
          }
          Copy-Item $nsisInstaller.FullName "release-assets/ExileRelay-Setup.exe" -Force
          Copy-Item $nsisInstaller.FullName "release-assets/ExileCompanionHUD-Setup.exe" -Force

          $hashes = Get-ChildItem "release-assets/*.exe" | ForEach-Object {
            $h = (Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()
            "$h  $($_.Name)"
          }
          $hashes | Set-Content -Path "release-assets/SHA256SUMS.txt" -Encoding UTF8

          $shortSha = $env:GITHUB_SHA.Substring(0, 7)
          $notes = @(
            "## Exile Relay ($tag)",
            "",
            '- **Ready-to-Run Portable App (Recommended):** `ExileRelay.exe` — standalone Windows x64 executable, zero installation required. Pre-configured for `https://exile-relay.dunhas.com`.',
            '- **Windows Setup Installer:** `ExileRelay-Setup.exe` — NSIS installer with Start Menu shortcut & WebView2 runtime check.',
            ('- **Source Commit:** `' + $shortSha + '`'),
            "",
            "### SHA-256 Checksums",
            '```text',
            ($hashes -join "`n"),
            '```'
          ) -join "`n"
          $notes | Set-Content -Path "release-notes.md" -Encoding UTF8

          $PSNativeCommandUseErrorActionPreference = $false
          gh release view $tag *> $null
          $exists = ($LASTEXITCODE -eq 0)
          $PSNativeCommandUseErrorActionPreference = $true

          if ($exists) {
            gh release upload $tag release-assets/ExileRelay.exe release-assets/ExileRelay-Setup.exe release-assets/ExileCompanionHUD.exe release-assets/ExileCompanionHUD-Setup.exe release-assets/SHA256SUMS.txt --clobber
            gh release edit $tag --title "Exile Relay $tag" --notes-file release-notes.md --draft=false --prerelease=false --latest
          } else {
            gh release create $tag release-assets/ExileRelay.exe release-assets/ExileRelay-Setup.exe release-assets/ExileCompanionHUD.exe release-assets/ExileCompanionHUD-Setup.exe release-assets/SHA256SUMS.txt --target $env:GITHUB_SHA --title "Exile Relay $tag" --notes-file release-notes.md --latest
          }
